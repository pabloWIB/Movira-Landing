<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6fb;
            color: #222;
            margin: 0;
            padding: 0;
        }
        h1 {
            text-align: center;
            margin-top: 40px;
            color: #2a4d69;
        }
        p {
            text-align: center;
            font-size: 1.2em;
            margin-bottom: 40px;
        }
        .links {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .links a {
            text-decoration: none;
            background: #4fc3f7;
            color: #fff;
            padding: 12px 28px;
            border-radius: 6px;
            font-weight: 500;
            transition: background 0.2s;
            box-shadow: 0 2px 8px rgba(44, 62, 80, 0.08);
        }
        .links a:hover {
            background: #1976d2;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Page</h1>
    <p>This is a simple HTML document.</p>
    <div class="links">
        <a href="pages/page1/index.html">Page 1</a>
        <a href="pages/page2/index.html">Page 2</a>
        <a href="pages/page3/index.html">Page 3</a>
    </div>
</body>
</html>
